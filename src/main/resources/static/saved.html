<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Posts - Our Social Network</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <div class="overlay-menu" id="fullMenu">
        <div style="display: flex; justify-content: flex-end;">
            <span class="material-icons" style="color:#ff3366; cursor:pointer; font-size:40px;" onclick="toggleOverlayMenu()">close</span>
        </div>
        <ul class="overlay-links" style="list-style:none; padding:0; margin-top:50px;">
            <li><a href="index.html">Home</a></li>
            <li><a href="top.html">Top Posts</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="search.html">Search</a></li>
            <li><a href="following.html">Following</a></li>        
            <li><a href="saved.html">Saved Posts</a></li>        
            <li><a href="messages.html">Messages</a></li>        
            <li><a href="notifications.html">Notifications</a></li>
            <li><a href="settings.html">Settings</a></li>
            <li><a href="#" class="logout" onclick="openLogoutModal()">Log Out</a></li>
        </ul>
    </div>

    <header class="top-bar">
        <div class="menu-trigger" onclick="toggleOverlayMenu()">
            <span class="material-icons">menu</span>
        </div>
        <div class="logo">Social<span>App</span></div>
        <div style="width: 50px;"></div> 
    </header>

    <nav class="bottom-nav">
        <a href="index.html"><span class="material-icons">home</span></a>
        <a href="search.html"><span class="material-icons">search</span></a>
        <a href="messages.html" id="nav-mail"><span class="material-icons">mail</span></a>
        <a href="notifications.html" id="nav-bell"><span class="material-icons">notifications</span></a>
        <a href="profile.html"><span class="material-icons">person</span></a>
    </nav>

    <div class="container">
        <main class="feed">
            <div class="feed-header" style="display: block !important; padding: 0 !important; margin: 0 -15px 20px -15px !important; position: sticky; top: 60px; z-index: 99; background: #1a0b2e;  border-bottom: 1px solid #334155;">
                <h2 style="padding: 15px 15px 10px 15px; margin: 0;">Saved Posts</h2>
                <div style="display: flex; width: 100%;">
                    <div id="tab-posts" onclick="switchTab('posts')" style="flex: 1; text-align: center; padding-bottom: 10px; cursor: pointer; color: #00e676; border-bottom: 2px solid #00e676; font-weight: bold; transition: 0.2s;">Posts</div>
                    <div id="tab-comments" onclick="switchTab('comments')" style="flex: 1; text-align: center; padding-bottom: 10px; cursor: pointer; color: gray; border-bottom: 2px solid transparent; font-weight: bold; transition: 0.2s;">Comments</div>
                </div>
            </div>
            
            
            <div id="feed">
                <p style="text-align: center; color: gray;">Loading your saved posts...</p>
            </div>
            <div id="loadingIndicator" style="display: none; text-align: center; padding: 20px; color: #00e676;">
                <span class="material-icons" style="animation: spin 1s linear infinite;">autorenew</span> Loading more...
            </div>
        </main>
    </div>

    <script src="shared.js"></script>
    <script>
        if (!currentUser) {
            window.location.href = "login.html";
        }

        let currentPage = 1;
        let isLoading = false;
        let hasMorePosts = true;
        let activeTab = 'posts'; // Default tab

        function switchTab(tab) {
            if (activeTab === tab) return;
            activeTab = tab;
            
            // Update Tab UI Colors
            document.getElementById('tab-posts').style.color = tab === 'posts' ? '#00e676' : 'gray';
            document.getElementById('tab-posts').style.borderBottom = tab === 'posts' ? '2px solid #00e676' : '2px solid transparent';
            document.getElementById('tab-comments').style.color = tab === 'comments' ? '#00e676' : 'gray';
            document.getElementById('tab-comments').style.borderBottom = tab === 'comments' ? '2px solid #00e676' : '2px solid transparent';
            
            // Reset state and show loading text so it isn't blank
            currentPage = 1;
            hasMorePosts = true;
            document.getElementById("feed").innerHTML = typeof generateSkeletonHTML === 'function' ? generateSkeletonHTML(3) : `<p style="text-align: center; color: gray; margin-top: 50px;">Loading ${tab}...</p>`;
            loadSavedData();
        }

        function loadSavedData() {
            if (isLoading || !hasMorePosts) return;
            isLoading = true;
            
            // THE FIX: If it is the first page, show skeletons. Otherwise, show the bottom loading spinner.
            if (currentPage === 1) {
                document.getElementById("feed").innerHTML = typeof generateSkeletonHTML === 'function' ? generateSkeletonHTML(3) : `<p style="text-align: center; color: gray; margin-top: 50px;">Loading ${activeTab}...</p>`;
            } else {
                document.getElementById('loadingIndicator').style.display = 'block';
            }

            const endpoint = activeTab === 'posts' ? '/api/getSavedPosts' : '/api/getSavedComments';

            fetch(`${API_BASE}${endpoint}`, {
                method: 'POST',
                body: JSON.stringify({ currentUser: currentUser, page: currentPage.toString() })
            })
            .then(async response => {
                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`Server Error ${response.status}: ` + errText.substring(0, 100));
                }
                const text = await response.text();
                try {
                    return JSON.parse(text);
                } catch (err) {
                    throw new Error("Java Server crashed and returned HTML instead of JSON.");
                }
            })
            .then(items => {
                document.getElementById('loadingIndicator').style.display = 'none';
                isLoading = false;
                
                const feedElement = document.getElementById("feed");
                if (currentPage === 1) feedElement.innerHTML = ""; // Clear loader

                if (items.length === 0 && currentPage === 1) {
                    feedElement.innerHTML = `<p style='text-align:center; color:gray; margin-top:50px;'>You haven't saved any ${activeTab} yet.</p>`;
                    hasMorePosts = false;
                    return;
                }

                if (items.length === 0) {
                    hasMorePosts = false;
                    return;
                }

                let feedHTML = "";
                items.forEach(item => {
                    if (!item) return;
                    try {
                        const kebabMenuHTML = typeof generateKebabMenu === "function" ? generateKebabMenu(item, activeTab === 'posts' ? 'post' : 'comment') : "";
                        const editedTag = item.isEdited ? `<span style="font-size: 11px; color: #6a6680; font-style: italic; margin-left: 5px;"> (edited)</span>` : "";
                        const shortTime = item.timestamp && String(item.timestamp).length > 16 ? String(item.timestamp).substring(0, 16) : (item.timestamp || "");

                        // MULTI-MEDIA GRID GENERATOR
                        let mediaHTML = typeof generateMediaGridHTML === 'function' ? generateMediaGridHTML(item.media, item.id) : "";

                        if (activeTab === 'posts') {
                            // POST RENDERER
                            const hasMedia = item.media && (typeof item.media === 'string' ? item.media.trim() !== "" : item.media.length > 0);
                            const isPureRepost = (!item.content || String(item.content).trim() === "") && !hasMedia && item.parentPost;
                        const targetUrl = isPureRepost ? (item.parentPost.isComment ? `post.html?id=${item.parentPost.postId}&commentId=${item.parentPost.id}` : `post.html?id=${item.parentPost.id}`) : `post.html?id=${item.id}`;
                        const quoteBoxHTML = typeof buildQuoteBox === "function" ? buildQuoteBox(item.parentPost) : "";
                        
                        feedHTML += `
                            <div id="post-card-${item.id}" class="post" onclick="window.location.href='${targetUrl}'" style="cursor: pointer; margin-bottom: 20px;">
                                <div class="user-info" style="display: flex; align-items: center; width: 100%;">
                                    <div style="display: flex; align-items: center; flex-shrink: 0; margin-right: 10px;">
                                        <img src="${item.avatar}" onclick="event.stopPropagation(); window.location.href='profile.html?user=${item.username}'" class="mini-profile-pic" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0;">
                                    </div>
                                    <div class="user-info-text-col" style="flex: 1; min-width: 0; padding-right: 10px; display: flex; flex-direction: column; justify-content: center;">
                                        <div style="display: flex; align-items: center; gap: 5px; width: 100%;">
                                            <a href="profile.html?user=${item.username}" onclick="event.stopPropagation();" style="color: white; text-decoration: none; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; display: inline-block;">${item.username}</a>
                                            ${editedTag}
                                        </div>
                                        <span class="time-stamp" style="font-size: 12px; color: gray; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;">${shortTime}</span>
                                    </div>
                                    <div style="display: flex; align-items: center; flex-shrink: 0; margin-left: auto;">
                                        ${kebabMenuHTML}
                                    </div>
                                </div>
                                <div class="post-content">
                                    <p>${typeof parseSocialText === "function" ? parseSocialText(item.content) : item.content}</p>
                                    ${mediaHTML}
                                    ${quoteBoxHTML}
                                </div>
                            </div>`;
                    } else {
                        // COMMENT RENDERER (Now features Deep-Link Routing!)
                        const targetCommentUrl = `post.html?id=${item.postId}&commentId=${item.id}`;
                        
                        feedHTML += `
                            <div id="comment-card-${item.id}" class="comment-thread" onclick="window.location.href='${targetCommentUrl}'" style="cursor: pointer; margin-bottom: 20px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                                <div style="display: flex; align-items: center; width: 100%;">
                                    <div style="display: flex; align-items: center; flex-shrink: 0; margin-right: 10px;">
                                        <img src="${item.avatar}" onclick="event.stopPropagation(); window.location.href='profile.html?user=${item.username}'" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                                    </div>
                                    <div class="user-info-text-col" style="flex: 1; min-width: 0; padding-right: 10px; display: flex; flex-direction: column; justify-content: center;">
                                        <div style="display: flex; align-items: center; gap: 5px; width: 100%;">
                                            <strong style="color: white; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.username}</strong>
                                            ${editedTag}
                                        </div>
                                        <span class="time-stamp" style="font-size: 12px; color: gray; margin-top: 2px;">${shortTime}</span>
                                    </div>
                                    <div style="margin-left: auto; display: flex; align-items: center;">
                                        ${kebabMenuHTML}
                                    </div>
                                </div>
                                <p style="font-size: 15px; color: #e0e0e0; margin-top: 10px; line-height: 1.4;">${typeof parseSocialText === "function" ? parseSocialText(item.content) : item.content}</p>
                                ${mediaHTML}
                                <div style="margin-top: 10px; color: #00e676; font-size: 12px; font-weight: bold;">View Original Post ➔</div>
                            </div>`;
                        }
                    } catch (err) {
                        console.error("Skipped corrupted saved item:", err);
                    }
                });
                
                feedElement.innerHTML += feedHTML;
                currentPage++;
            })
            .catch(error => {
                document.getElementById('loadingIndicator').style.display = 'none';
                isLoading = false;
                console.error("Error loading saved items:", error);
                
                // THE CRASH CATCHER
                if (currentPage === 1) {
                    document.getElementById("feed").innerHTML = `
                        <div style="text-align: center; margin-top: 50px;">
                            <span class="material-icons" style="font-size: 40px; color: #ff3366;">error_outline</span>
                            <p style="color: #ff3366; font-weight: bold; margin-top: 10px;">Failed to fetch ${activeTab}.</p>
                            <p style="color: gray; font-size: 13px;">Ensure the Java Server is running and you compiled the latest Main.java changes.</p>
                        </div>`;
                }
            });
        }

        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
                loadSavedData();
            }
        });

        loadSavedData();
    </script>
</body>
</html>
